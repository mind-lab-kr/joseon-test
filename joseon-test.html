<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선시대에 태어났다면?</title>
<meta name="description" content="10가지 질문으로 알아보는 조선시대 나의 신분! 선비, 장수, 거상, 화공, 의병, 예인 중 당신은?">
<meta property="og:title" content="조선시대에 태어났다면?">
<meta property="og:description" content="당신은 조선시대에서 어떤 삶을 살았을까요? 지금 바로 확인해보세요!">
<meta property="og:image" content="images/joseon-test-banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">🏯 조선시대에 태어났다면?</div>
  <p class="tagline">10가지 질문으로 알아보는 나의 조선시대 신분과 삶</p>
</header>

<main class="container">
  <div class="quiz-shell">
    <a class="back-link" href="index.html">← 처음으로</a>

    <!-- 인트로 -->
    <section class="intro-panel" id="introPanel">
      <img class="intro-banner" src="images/joseon-test-banner.png" alt="조선시대에 태어났다면? 테스트 배너">
      <h1>조선시대에 태어났다면 당신은?</h1>
      <p>양반, 장수, 거상, 화공, 의병, 예인... 당신의 성향으로 알아보는 조선시대 속 나의 모습. 10개의 질문에 솔직하게 답해보세요!</p>
      <button class="btn" id="startBtn">테스트 시작하기 ▶</button>
    </section>

    <!-- 퀴즈 -->
    <section id="quizPanel" style="display:none;">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">0 / 10</div>
      </div>
      <div id="questionsWrap"></div>
    </section>

    <!-- 결과 영역 (3단계) -->
    <section id="resultArea" style="display:none;">
      <div class="result-stage" id="stage1"></div>
      <div class="result-stage" id="stage2"></div>
      <div class="result-stage" id="stage3"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  ⓒ 2026 조선시대에 태어났다면? · 본 결과는 재미로 즐기는 콘텐츠이며 과학적 근거가 없습니다.
</footer>

<script src="js/joseon-test.js"></script>
</body>
</html>
